<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden;
    background: transparent; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    -webkit-user-select: none; user-select: none;
    perspective: 700px;
  }
  #grem {
    max-height: 100%; max-width: 100%; object-fit: contain;
    cursor: pointer;
    filter: drop-shadow(0 0 14px rgba(90, 255, 140, 0.35));
    transition: transform .25s ease, filter .25s ease;
    transform-style: preserve-3d;
  }
  #grem.talking {
    filter: drop-shadow(0 0 24px rgba(120, 255, 170, 0.85));
    transform: scale(1.03);
  }
  /* celebratory jump + spin when Gremlin finishes thinking */
  #grem.spin {
    animation: jumpspin .8s cubic-bezier(.34, 1.56, .5, 1) 1;
  }
  @keyframes jumpspin {
    0%   { transform: translateY(0)     rotateY(0)      scale(1); }
    30%  { transform: translateY(-26px) rotateY(170deg) scale(1.06); filter: drop-shadow(0 0 26px rgba(130,255,180,0.9)); }
    60%  { transform: translateY(-26px) rotateY(360deg) scale(1.06); filter: drop-shadow(0 0 26px rgba(130,255,180,0.9)); }
    100% { transform: translateY(0)     rotateY(360deg) scale(1); }
  }
  #quit-btn {
    position: fixed; top: 4px; right: 6px;
    width: 16px; height: 16px;
    color: rgba(150, 255, 230, 0.5);
    font: 12px monospace; text-align: center; line-height: 16px;
    cursor: pointer; z-index: 10;
  }
  #quit-btn:hover { color: rgba(255, 255, 255, 0.9); }
</style>
</head>
<body>
  <div id="quit-btn" title="Quit">&times;</div>
  <video id="grem" autoplay loop muted playsinline>
    <source src="gremlin.mp4" type="video/mp4">
  </video>
<script>
  var grem = document.getElementById('grem');
  var wasTalking = false;

  // MainActivity calls this: true while answering, false when done.
  function setTalking(on) {
    if (on) {
      grem.classList.add('talking');
      wasTalking = true;
    } else {
      grem.classList.remove('talking');
      if (wasTalking) { doSpin(); wasTalking = false; }
    }
  }
  function doSpin() {
    grem.classList.remove('spin');
    void grem.offsetWidth;        // reflow so the animation can restart
    grem.classList.add('spin');
  }
  grem.addEventListener('animationend', function (e) {
    if (e.animationName === 'jumpspin') grem.classList.remove('spin');
  });

  grem.addEventListener('click', function () {
    try { if (window.Android && window.Android.openSettings) window.Android.openSettings(); } catch (e) {}
  });
  document.getElementById('quit-btn').addEventListener('click', function () {
    try { if (window.Android && window.Android.quit) window.Android.quit(); } catch (e) {}
  });
  if (grem.play) { grem.play().catch(function () {}); }
</script>
</body>
</html>
