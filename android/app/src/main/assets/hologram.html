<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden;
    background: transparent; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    -webkit-user-select: none; user-select: none;
  }
  #stage {
    position: relative;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .layer {
    position: absolute;
    max-height: 100%; max-width: 100%;
    object-fit: contain;
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease;
    filter: drop-shadow(0 0 14px rgba(90, 255, 140, 0.35));
  }
  .layer.active {
    opacity: 1;
    pointer-events: auto;
  }
  #img-think.active {
    animation: grem-think 2.4s ease-in-out infinite;
  }
  @keyframes grem-think {
    0%, 100% {
      transform: translateY(0px) rotate(0deg) scale(1);
      filter: drop-shadow(0 0 14px rgba(90, 255, 140, 0.45));
    }
    50% {
      transform: translateY(-4px) rotate(-1.5deg) scale(1.02);
      filter: drop-shadow(0 0 24px rgba(120, 255, 175, 0.85));
    }
  }
  #v-talk.active {
    filter: drop-shadow(0 0 22px rgba(120, 255, 170, 0.78));
  }
  #quit-btn {
    position: fixed; top: 4px; right: 6px;
    width: 16px; height: 16px;
    color: rgba(150, 255, 230, 0.5);
    font: 12px monospace; text-align: center; line-height: 16px;
    cursor: pointer; z-index: 10;
  }
  #quit-btn:hover { color: rgba(255, 255, 255, 0.9); }
</style>
</head>
<body>
  <div id="quit-btn" title="Quit">&times;</div>
  <div id="stage">
    <video id="v-idle" class="layer" loop muted playsinline preload="auto" src="gremlin_idle.mp4"></video>
    <img id="img-think" class="layer" src="gremlin_thinking.jpg" alt="">
    <video id="v-spin" class="layer active" autoplay muted playsinline preload="auto" src="gremlin_spin.mp4"></video>
    <video id="v-talk" class="layer" loop muted playsinline preload="auto" src="gremlin_talk.mp4"></video>
  </div>
<script>
  var vIdle = document.getElementById('v-idle');
  var imgThink = document.getElementById('img-think');
  var vSpin = document.getElementById('v-spin');
  var vTalk = document.getElementById('v-talk');
  var layers = [vIdle, imgThink, vSpin, vTalk];

  var curState = 'opening';
  var spinTimer = null;

  function showOnly(el) {
    for (var i = 0; i < layers.length; i++) {
      if (layers[i] === el) layers[i].classList.add('active');
      else layers[i].classList.remove('active');
    }
  }

  function safePlay(v) {
    try {
      var p = v.play();
      if (p && p.catch) p.catch(function () {});
    } catch (e) {}
  }

  function safePause(v) {
    try { v.pause(); } catch (e) {}
  }

  function startTalkLoop() {
    if (spinTimer) { clearTimeout(spinTimer); spinTimer = null; }
    if (curState === 'opening') {
      setState('idle');
      return;
    }
    if (curState !== 'responding') return;
    safePause(vSpin);
    try { vTalk.currentTime = 0; } catch (e) {}
    showOnly(vTalk);
    safePlay(vTalk);
  }

  vSpin.addEventListener('ended', function () {
    startTalkLoop();
  });

  // States: 'idle' | 'thinking' | 'responding'
  function setState(next) {
    if (next !== 'idle' && next !== 'thinking' && next !== 'responding') next = 'idle';
    if (next === curState) return;
    curState = next;
    if (spinTimer) { clearTimeout(spinTimer); spinTimer = null; }

    if (next === 'idle') {
      safePause(vSpin);
      safePause(vTalk);
      showOnly(vIdle);
      // Play the opening animation once, then settle into the cute blinking idle loop.
  spinTimer = setTimeout(function () {
    if (curState === 'opening') setState('idle');
  }, 2600);
  safePlay(vSpin);
    } else if (next === 'thinking') {
      safePause(vIdle);
      safePause(vSpin);
      safePause(vTalk);
      showOnly(imgThink);
    } else if (next === 'responding') {
      safePause(vIdle);
      safePause(vTalk);
      try { vSpin.currentTime = 0; } catch (e) {}
      showOnly(vSpin);
      safePlay(vSpin);
      // Fallback in case WebView misses the ended event
      spinTimer = setTimeout(startTalkLoop, 2600);
    }
  }

  // Backwards-compatible alias
  function setTalking(on) {
    setState(on ? 'responding' : 'idle');
  }

  document.getElementById('stage').addEventListener('click', function () {
    try { if (window.Android && window.Android.openSettings) window.Android.openSettings(); } catch (e) {}
  });
  document.getElementById('quit-btn').addEventListener('click', function () {
    try { if (window.Android && window.Android.quit) window.Android.quit(); } catch (e) {}
  });
  safePlay(vIdle);
</script>
</body>
</html>
