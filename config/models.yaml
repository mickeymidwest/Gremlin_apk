# To register the vision model itself, add this to `models:` above once
# BOTH files are downloaded (a VLM is weights + an mmproj projector --
# with only the weights it loads fine and then silently can't see):
#
#   - name: qwen25-vl-3b
#     type: local_vlm
#     display_name: "Qwen2.5-VL 3B (vision specialist)"
#     model_path: "/home/mickey/Downloads/gremlin/models/Qwen2.5-VL-3B-Instruct-Q4_K_M.gguf"
#     mmproj_path: "/home/mickey/Downloads/gremlin/models/mmproj-Qwen2.5-VL-3B-Instruct-Q8_0.gguf"
#     handler: qwen25vl
#     n_ctx: 4096
#     n_gpu_layers: -1
#
# Both from ggml-org/Qwen2.5-VL-3B-Instruct-GGUF -- 1930MB + 845MB =
# ~2.8GB total, verified by real HEAD request. On an 8GB card that does
# NOT fit alongside the 5.4GB primary, so the primary gets unloaded for
# the duration of a vision call (same swap consult already does).
