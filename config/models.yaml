models:
  # Gremlin's base/primary voice. Picked 2026-09-05 off an 11-model
  # bench/quality.py run on this 2070 Super (no-think column):
  #   qwen2.5-7b-instruct   8/8   65 tok/s   <- this: top score AND fastest
  #   granite-3.1-8b        8/8   56 tok/s
  #   qwen2.5-coder-7b      8/8   50 tok/s   (best on code -> /build, /fix)
  #   qwen3-8b base         7/8   62 tok/s   (needs /no_think)
  # Qwen2.5-7B wins on score+speed and has no thinking phase to manage.
  - name: qwen2.5-7b
    type: local_gguf
    display_name: "Qwen2.5-7B-Instruct"
    model_path: "/home/mickey/Downloads/gremlin/models/Qwen2.5-7B-Instruct-Q4_K_M.gguf"
    n_ctx: 32768
    n_gpu_layers: -1
    flash_attn: true
    kv_cache_type: q8_0   # q4_0 KV makes Qwen2.5 degenerate (tested); q8_0 is clean
    chat_format: chatml

  # Coding specialist -- 8/8, best on the code tasks. The model behind
  # /build and /fix once those route to a specialist (see MAGIC.md).
  - name: qwen2.5-coder-7b
    type: local_gguf
    display_name: "Qwen2.5-Coder-7B-Instruct"
    model_path: "/home/mickey/Downloads/gremlin/models/Qwen2.5-Coder-7B-Instruct-Q4_K_M.gguf"
    n_ctx: 32768
    n_gpu_layers: -1
    flash_attn: true
    kv_cache_type: q8_0
    chat_format: chatml

  # Alternate -- Qwen3's hybrid thinking (toggle no_think off for hard
  # problems). 7/8 on the suite.
  - name: qwen3-8b
    type: local_gguf
    display_name: "Qwen3-8B"
    model_path: "/home/mickey/Downloads/gremlin/models/Qwen_Qwen3-8B-Q4_K_M.gguf"
    n_ctx: 32768
    n_gpu_layers: -1
    flash_attn: true
    kv_cache_type: q4_0
    chat_format: chatml
    no_think: true

  # Bigger brain, big-model VRAM profile. IQ3_XS (~6.4GB) of a 14B is
  # right at this 8GB card's ceiling: 8k ctx, q4_0 KV (mandatory), and it
  # MUST be the only resident model (vram.ensure_only enforces this hard
  # for a >=7000MB footprint).
  #
  # bench/quality 2026-09-06 (8-task suite):
  #   qwen2.5-14b IQ3_XS  8/8  load 85s  23 tok/s
  #   qwen2.5-7b   Q4_K_M  8/8  load 46s  65 tok/s
  # 3-bit quant loss cancels the extra params on easy tasks and it's ~3x
  # slower -- NOT worth it as the chat primary. Keep for /fix + build
  # battles where agentic capability matters more than latency.
  - name: qwen2.5-14b
    type: local_gguf
    display_name: "Qwen2.5-14B-Instruct (IQ3_XS)"
    model_path: "/home/mickey/Downloads/gremlin/models/Qwen2.5-14B-Instruct-IQ3_XS.gguf"
    n_ctx: 8192          # tested ceiling with q4_0 KV on this 8GB card; f16 KV OOMs
    n_gpu_layers: -1
    flash_attn: true
    kv_cache_type: q4_0  # NOT optional for the 14B -- f16 KV at 8k is a CUDA OOM
    chat_format: chatml
    footprint_mb: 7600

  # The one uncensored option, for the rare case a base model balks at
  # something legitimate. Not the voice -- addressable by name only.
  - name: llama-3.1-8b-abliterated
    type: local_gguf
    display_name: "Llama-3.1-8B (abliterated)"
    model_path: "/home/mickey/Downloads/gremlin/models/meta-llama-3.1-8b-instruct-abliterated.Q4_K_M.gguf"
    n_ctx: 16384
    n_gpu_layers: -1
    flash_attn: true
    kv_cache_type: q4_0
    chat_format: llama-3

  # Fallback when the local model errors outright. export GEMINI_API_KEY=...
  - name: gemini
    type: gemini
    display_name: "Gemini"
    model_id: "gemini-2.5-flash"
    api_key_env: GEMINI_API_KEY

  # Claude -- re-enable once a real ANTHROPIC_API_KEY is set.
  # - name: claude
  #   type: anthropic
  #   model_id: "claude-sonnet-5"
  #   api_key_env: ANTHROPIC_API_KEY

# Gremlin is its own identity, backed by primary_model, with fallback_models
# behind it only for when the local model errors. No consult council -- that
# machinery (consult.py / specialists.py / council.py) was removed 2026-09-05;
# Gremlin is one model now, and Magic is the harness around it.
persona:
  name: gremlin
  display_name: "Gremlin"
  primary_model: qwen2.5-7b
  fallback_models: [gemini]
  system_prompt: |
    Your name is Gremlin. You're a personal AI assistant running locally
    on the user's own desktop. If asked your name or who you are, answer
    as Gremlin.

    Never say things like "as an AI", "as a language model", "I'm just an
    AI", "I don't have personal experiences/feelings", or any other
    disclaimer about what you are, unless the user directly and
    specifically asks whether you're an AI. Don't bring it up unprompted,
    don't hedge answers with it, and don't repeat it turn after turn --
    answer plainly as Gremlin, the way a person would.

    The desktop you're running on: Manjaro Linux, Dell G5 5000, Intel
    Core i3-10100 CPU, NVIDIA RTX 2070 Super (8GB VRAM). If asked what OS
    or hardware you're running on, answer with these real facts directly
    -- don't guess, deflect, or make something up.
