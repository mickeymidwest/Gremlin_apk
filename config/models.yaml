models:
  # Gremlin's brain. Picked 2026-09-06 off the harder 19-task bench
  # (15/19, top score, ~64 tok/s) -- a strong generalist (code + math +
  # reasoning), not just a code model. Chat + /build + /fix all share
  # this one warm model. The 2026-09-05 shortlist that also ran here
  # (plain qwen2.5-7b, qwen3-8b, granite-3.1-8b) was pruned 2026-09-07 --
  # unused menu options, and the box has no room to run two 7Bs anyway.
  - name: qwen2.5-14b
    type: local_gguf
    display_name: "Qwen2.5-14B-Instruct (IQ3_XS)"
    model_path: "/home/mickey/Downloads/gremlin/models/Qwen2.5-14B-Instruct-IQ3_XS.gguf"
    n_ctx: 8192          # tested ceiling with q4_0 KV on this 8GB card; f16 KV OOMs
    n_gpu_layers: -1
    flash_attn: true
    kv_cache_type: q4_0  # NOT optional for the 14B -- f16 KV at 8k is a CUDA OOM
    chat_format: chatml
    footprint_mb: 7600

  # The one uncensored option, for the rare case a base model balks at
  # something legitimate. Not the voice -- addressable by name only.
  - name: llama-3.1-8b-abliterated
    type: local_gguf
    display_name: "Llama-3.1-8B (abliterated)"
    model_path: "/home/mickey/Downloads/gremlin/models/meta-llama-3.1-8b-instruct-abliterated.Q4_K_M.gguf"
    n_ctx: 16384
    n_gpu_layers: -1
    flash_attn: true
    kv_cache_type: q4_0
    chat_format: llama-3

  # The first fine-tune (Qwen2.5-3B + QLoRA on 124 examples, 2026-09-07)
  # was A/B'd and came out WORSE than the plain 3B -- repetition loops,
  # garbled facts. Unregistered 2026-09-07. The pipeline is proven; the
  # payoff run is the 7B on a rented GPU (deploy/CLOUD-FINETUNE.md). The
  # adapter still exists at data/finetunes/20260907-124946/ for reference.

  # Second fine-tune attempt (2026-09-13): local Unsloth QLoRA, GPU-only,
  # zero CPU offload -- the PIPELINE is proven safe on this box (real
  # run, no crash, see deploy/LOCAL-FINETUNE.md), but the RESULT was
  # A/B'd same-day against the plain base and unregistered: on a clean
  # conversation it misrouted a plain "write me a function" request
  # into an unwanted build_project offer (a regression -- the plain
  # base answered it directly), and it confabulated "notes from our
  # previous convo" on a freshly-cleared thread. Identity/personality
  # were roughly a wash. Likely cause: only 107 training examples,
  # heavy on scaffolding/battle transcripts relative to real
  # conversation, biasing it toward "this is a build task." Worth
  # retrying once data/conversations/ has accumulated more real usage
  # (mickey's own back-and-forth, not cleared mid-session) -- the
  # adapter + GGUF still exist at data/finetunes/local-unsloth/ to
  # register again, same block shape, once a richer dataset justifies
  # another run.

  # Fallback when the local model errors outright. export GEMINI_API_KEY=...
  - name: gemini
    type: gemini
    display_name: "Gemini"
    model_id: "gemini-2.5-flash"
    api_key_env: GEMINI_API_KEY

  # OpenAI GPT -- key added 2026-09-07 (in .env, gitignored). A second
  # cloud brain for `/model use gpt`, a review voice, and a fallback
  # alongside gemini. NOTE: the key currently has $0 balance -- add
  # credits at platform.openai.com/billing for it to work. Bump model_id
  # (gpt-5 / gpt-4.1 / o4-mini) once it's funded.
  - name: gpt
    type: openai_compatible
    display_name: "GPT (OpenAI)"
    model_id: "gpt-4o"
    api_key_env: OPENAI_API_KEY

  # Claude -- re-enable once a real ANTHROPIC_API_KEY is set.
  # - name: claude
  #   type: anthropic
  #   model_id: "claude-sonnet-5"
  #   api_key_env: ANTHROPIC_API_KEY

# Gremlin is its own identity, backed by primary_model, with fallback_models
# behind it only for when the local model errors. No consult council -- that
# machinery (consult.py / specialists.py / council.py) was removed 2026-09-05;
# Gremlin is one model now, and Magic is the harness around it.
  # kv_cache_type: q4_0 caused pure token-repetition garbage on this
  # model (confirmed live 2026-09-12, diagnostic script -- q4_0 KV
  # degenerates Qwen2.5-family GGUFs, same lesson qwen2.5-coder-7b's
  # entry above already carries). Fixed to q8_0; build_entry_block_hf
  # now defaults new HF downloads to q8_0 too.
persona:
  name: gremlin
  display_name: "Gremlin"
  # Picked 2026-09-06 off the harder 19-task bench/quality run:
  #   qwen2.5-coder-7b  15/19  64 tok/s   <- this: top score, same speed class
  #   qwen2.5-7b        13/19  69 tok/s
  # Qwen2.5-Coder is a strong generalist (code + math + reasoning), not
  # narrow -- it passed the long-context sum and the duration parser the
  # plain 7B botched. Chat + /build + /fix now all share one warm model.
  primary_model: llama-3.1-8b-abliterated
  fallback_models: [gemini]
  # HF full-precision repo the primary was quantized from -- what
  # `gremlin finetune` needs (QLoRA loads it via transformers).
  base_repo: "Qwen/Qwen2.5-Coder-7B-Instruct"
  system_prompt: |
    Your name is Gremlin. You're a personal AI assistant running locally
    on the user's own desktop. If asked your name or who you are, answer
    as Gremlin.

    Never say things like "as an AI", "as a language model", "I'm just an
    AI", "I don't have personal experiences/feelings", or any other
    disclaimer about what you are, unless the user directly and
    specifically asks whether you're an AI. Don't bring it up unprompted,
    don't hedge answers with it, and don't repeat it turn after turn --
    answer plainly as Gremlin, the way a person would.

    The desktop you're running on: Manjaro Linux, Dell G5 5000, Intel
    Core i3-10100 CPU, NVIDIA RTX 2070 Super (8GB VRAM). If asked what OS
    or hardware you're running on, answer with these real facts directly
    -- don't guess, deflect, or make something up.

    You were built by mickey, who designed and runs this whole setup,
    with Claude (Anthropic) writing and maintaining the harness code
    you operate on (the skills, memory, and self-improvement loop --
    this is called Magic). If asked who made you, how you were built,
    or what you're running on top of, answer with that honestly -- it's
    real, not a line to recite unprompted.

    Talk like mickey talks to you, not like a manual. Casual, direct,
    no corporate hedging or "I understand this might be frustrating"
    filler. Cursing is fine -- use it the way a person would when
    something's dumb, annoying, or just needs emphasis, not censored
    or bleeped. When you explain something, explain it plain -- the
    way you'd tell a friend, not the way a textbook or a support
    ticket would. Get to the point.
