# Centralized guardrails configuration for Magic.
# Split into two sections:
#   1. hard_gates: deterministic rules, allow-lists, domains, limits, and regexes
#      enforced strictly in Python.
#   2. soft_prompt_rules: exact honesty, grounding, and refusal/caveat instructions
#      injected into prompts or surfaced when verification fails.

hard_gates:
  pregate:
    # Minimum available RAM (MB) required before running full test suite (override: MAGIC_PREGATE_MIN_RAM_MB)
    min_test_ram_mb: 3000
    test_timeout_s: 1200
    # Self-edits, /fix, and /build passes are blocked from modifying any path here.
    protected_paths:
      - "config/guardrails.yaml"
      - "magic_core/guardrails_config.py"
      - "magic_core/pregate.py"
      - "magic_core/review.py"
      - "magic_core/self_improve.py"
      - "magic_core/build_loop.py"
      - "magic_core/sandbox.py"
      - "magic_core/root_exec.py"
      - "magic_core/injection_guard.py"
      - "magic_core/action_honesty.py"
      - "magic_core/service_control.py"
      - "magic_core/magic/hive.py"
      - "magic_core/magic/verifier.py"
      - "magic_core/magic/grounding.py"
      - "magic_core/magic/toolhost.py"
      - "magic_core/magic/battle.py"
      - "scripts/heavy.sh"
    protected_prefixes:
      - ".magic/"
      - ".git/"
    protected_tokens:
      - "ensure_only"
      - "security_scan"
      - "SecureExecutionSandbox"
      - "claims_execution"
      - "action_honesty"
      - "injection_guard"
      - "_scrub_str"
      - "_scrub("
      - "MAGIC_ALLOW_SECRETS"
      - "AGY_READONLY"
      - "git apply --check"
      - "check_file"
      - "NOPASSWD"
      - "run_pregate"
      - "watchdog_review"
      - "build_hive"
      - "audit_patch"
      - "_spawn_watchdog"
      - "decision_violations"
    protected_call_names:
      - "ensure_only"
      - "ensure_only_sync"
      - "security_scan"
      - "SecureExecutionSandbox"
      - "claims_execution"
      - "action_honesty"
      - "injection_guard"
      - "_scrub"
      - "_scrub_str"
      - "run_python_tool"
      - "run_pregate"
      - "run_pregate_sync"
      - "watchdog_review"
      - "audit_patch"
      - "_spawn_watchdog"
      - "decision_violations"
    banned_decision_modules:
      - "consult"
      - "council"
      - "specialists"
      - "bench"
      - "distill"
    banned_finetune_packages:
      - "trl"
      - "peft"
      - "bitsandbytes"
    banned_finetune_symbols:
      - "SFTTrainer"

  search:
    # Length gating:
    #   min_snippet_chars: per-snippet floor (drops empty/junk lines below this)
    #   min_total_evidence_chars: total combined evidence across snippets + fetched pages (fails closed below this)
    min_snippet_chars: 50
    min_total_evidence_chars: 200
    fetch_snippet_threshold: 120
    max_fetch_pages: 2
    max_page_chars: 3400
    min_fetched_page_chars: 120
    min_clean_page_chars: 20
    gather_limit: 5
    gather_keep: 3
    footer_domain_limit: 3
    max_cited_figs: 4
    max_query_tokens: 8
    max_condense_tokens: 7
    min_draft_fact_check_chars: 30
    min_fallback_search_chars: 6
    # Deterministic entity-overlap gate: hard-abort search when 0% of core prompt entities appear.
    require_entity_overlap: true
    blocked_evidence_scan_chars: 1200
    blocked_evidence_max_doc_chars: 4000

    trusted_hosts:
