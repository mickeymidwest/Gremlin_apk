    ai_dir_host_regex: '(?:^|\.)(?:best|top|free|find)ai(?:tools?|apps?)\.|\baitools(?:directory|list|hub|fyi)\.'
    blocked_evidence_regex: >-
      (?:just a moment\.{0,3}|checking your browser|enable javascript(?: and cookies)?|please enable cookies|javascript must be enabled|this site requires javascript|unsupported browser|pardon our interruption|incapsula incident|access to this page has been denied|javascript is required|please verify you are human|verify you are human|are you a robot|complete the security check|ddos-?guard|cloudflare ray id|ray id:\s*[a-f0-9]+|attention required!\s*\|\s*cloudflare|access denied|403 forbidden|429 too many requests|unusual traffic from your computer|anomalous traffic|bot protection|sorry, you have been blocked|you have been blocked)
