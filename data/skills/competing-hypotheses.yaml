id: skill_16994c9b
name: competing-hypotheses
status: candidate
destination: card
council_reviewed: false
purpose: Systematically evaluate multiple potential root causes for a failure before committing
  to a fix, ensuring the chosen solution is validated against all alternatives.
trigger_when: The diagnostic phase identifies two or more plausible root causes (e.g., config
  mismatch, path error, dependency issue, permission denial, or runtime state) that cannot
  be immediately distinguished by a single quick check.
trigger_matcher: bug|failure|broken|why is|root cause|crash
procedure:
- 1. Enumerate exactly 3 distinct candidate hypotheses for the failure, explicitly naming
  the specific file, line, or configuration item associated with each.
- 2. For each hypothesis, write a precise, minimal command or code snippet to verify it (e.g.,
  'read_file(path) to check syntax', 'run_command() to test perms', 'inspect_graph() to check
  method signatures').
- 3. Execute the verification for the most likely hypothesis first; if it fails, immediately
  execute the verification for the second most likely hypothesis.
- 4. If a verification step returns a clear error (SyntaxError, PermissionError, etc.), abort
  that specific hypothesis and proceed to the next candidate without attempting a partial
  file edit.
- 5. Only commit to a fix when the evidence definitively rules out all other candidates and
  the proposed fix resolves the specific error identified in the verification step.
- 6. Before finalizing, run the full test suite (e.g., 'python -m pytest -q') to ensure the
  fix does not introduce new failures or break the file's validity.
