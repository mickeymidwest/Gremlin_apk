id: skill_16994c9b
name: competing-hypotheses
status: candidate
destination: card
council_reviewed: false
purpose: Isolate the exact root cause among multiple candidates by executing targeted verification
  commands in sequence, ensuring the fix is applied only after positive confirmation and full
  regression testing.
trigger_when: The diagnostic phase identifies two or more plausible root causes (e.g., config
  mismatch, path error, dependency issue, permission denial, or runtime state) that cannot
  be immediately distinguished by a single quick check.
trigger_matcher: bug|failure|broken|why is|root cause|crash
procedure:
- Enumerate exactly 3 distinct candidate hypotheses, specifying the exact file path, line
  number, or configuration key responsible for each.
- For each hypothesis, generate a single, executable verification command that returns a definitive
  True/False or Error status (e.g., `grep -n 'keyword' file.txt`, `ls -l path`, `python -c
  'import module'`), avoiding broad searches like `grep` for method definitions.
- 'Execute the verification command for the #1 most likely hypothesis first; if it returns
  a clear error or confirms the issue, proceed to Step 4. If it returns no error, immediately
  execute the #2 hypothesis verification.'
- If a verification step returns a clear error (SyntaxError, PermissionError, etc.), abort
  that specific hypothesis and proceed to the next candidate in the list without attempting
  a partial file edit.
- Only commit to a fix when the evidence definitively rules out all other candidates AND the
  proposed fix directly addresses the specific error identified in the verification step.
- Before finalizing, execute the full test suite (e.g., `python -m pytest -q`) to ensure the
  fix resolves the failure without introducing new failures or breaking the file's validity.
- If the fix requires modifying a file, edit only the specific line or section identified
  by the hypothesis; if the edit would make the file invalid (SyntaxError), switch to `write_file`
  with the WHOLE corrected file content.
- If the fix requires modifying tests, update the test file directly rather than relying solely
  on `pytest` to detect the issue; ensure the test passes after the edit.
