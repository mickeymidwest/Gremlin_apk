id: skill_1c78adb2
name: failure-mode-analysis
status: candidate
destination: card
council_reviewed: false
purpose: Prevent runtime crashes and logic errors by proactively identifying specific failure
  vectors and implementing targeted mitigations before execution.
trigger_when: The agent is about to execute a code block that modifies state, handles user
  input, or performs a non-trivial calculation with potential side effects.
trigger_matcher: deploy|apply|ship|change|production|live
procedure:
- 1. Identify the specific input variables and edge cases (e.g., empty lists, null values,
  malformed data) that could cause the current logic to break.
- 2. Determine the exact line(s) of code that will fail under these conditions and draft a
  targeted fix or guard clause.
- 3. If the fix requires rewriting a function or file to ensure validity, invoke `write_file`
  with the entire corrected content; otherwise, apply the minimal edit directly.
- 4. Generate a specific test case or assertion that covers the identified failure mode.
- 5. Execute the test immediately to verify the fix resolves the failure before proceeding
  to the next step.
- 6. If the test fails or the logic is complex, pause and re-evaluate the approach rather
  than forcing a partial edit.
