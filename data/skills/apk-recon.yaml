id: seed_25
name: apk-recon
status: active
destination: card
council_reviewed: false
purpose: 'map an Android app''s attack surface: components, data flow, native code'
trigger_when: analyzing or pentesting an Android APK
trigger_matcher: apk|android app|jadx|apktool|frida|drozer|exported|deep link|AndroidManifest|dex|smali
procedure:
- jadx-gui the apk; read AndroidManifest for exported=true activities/services/receivers/providers,
  and intent-filter deep links
- 'grep decompiled source for: hardcoded secrets/keys, cleartext http, WebView addJavascriptInterface,
  SQL string-building, file paths from intents, exported ContentProvider queries'
- check network_security_config, certificate pinning, root/debug/emulator checks -- and how
  to bypass them (Frida hooks)
- 'runtime: Frida to hook crypto, auth, and the checks above; mitmproxy for the traffic; look
  for IDOR in the API the app calls'
- if there's a lib*.so, pull it and run binary-recon on it
