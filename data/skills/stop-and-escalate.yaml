id: skill_34e886a0
name: stop-and-escalate
status: active
destination: card
council_reviewed: false
purpose: Halt autonomous execution immediately upon detecting a state of no progress, infinite
  looping, or potential safety violation, then escalate to human review or a specific, safe
  recovery action.
trigger_when: The agent's internal state indicates repeated failed attempts (same error >2
  times), circular logic, or an action violating safety policies/exceeding authority.
trigger_matcher: stuck|loop|can't proceed|permission|unsafe|need approval
procedure:
- 1. Immediately halt all file writing and code generation operations to prevent corruption
  or invalid syntax.
- 2. Analyze the current execution log to confirm a loop (same error repeated >2 times) or
  zero progress state.
- 3. If a loop is detected, do NOT attempt local code fixes; instead, trigger a full system
  restart or ask the user to re-initialize the session.
- 4. If an unsafe or out-of-bounds action is identified, explicitly state the risk and refuse
  to execute the command.
- '5. Generate a concise summary containing: current state, root cause of the loop/error,
  and the specific action required to resolve it.'
- 6. Submit this summary to the human operator or escalation channel for approval before proceeding
  with any recovery.
