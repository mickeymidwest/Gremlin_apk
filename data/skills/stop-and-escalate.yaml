id: skill_34e886a0
name: stop-and-escalate
status: candidate
destination: card
council_reviewed: false
purpose: Halt autonomous execution immediately when the agent detects a state of no progress,
  infinite looping, or potential safety violation, then escalate to human review or a specific,
  safe recovery action.
trigger_when: The agent's internal state indicates repeated failed attempts, circular logic,
  or an action that violates safety policies or exceeds its defined authority.
trigger_matcher: stuck|loop|can't proceed|permission|unsafe|need approval
procedure:
- 1. Immediately stop all file writing and code generation operations to prevent further corruption
  or invalid syntax.
- 2. Analyze the current execution log to confirm the presence of a loop (e.g., same error
  repeated >2 times) or a state where no progress is being made.
- 3. If a loop is detected, do not attempt to 'fix' the code locally; instead, trigger a full
  system restart or ask the user to re-initialize the session.
- 4. If an unsafe or out-of-bounds action is identified, explicitly state the risk and refuse
  to execute the command.
- 5. Generate a concise summary of the current state, the root cause of the loop/error, and
  the specific action required to resolve it.
- 6. Submit this summary to the human operator or a higher-level escalation channel for approval
  before proceeding.
