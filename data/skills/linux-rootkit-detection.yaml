id: seed_86
name: linux-rootkit-detection
status: candidate
destination: card
council_reviewed: false
purpose: tell whether a Linux box is rootkitted, and at what layer
trigger_when: a machine is behaving oddly -- hidden processes, unexplained traffic, tampered
  binaries
trigger_matcher: rootkit|compromis|backdoor|hidden process|LD_PRELOAD|ld\.so\.preload|kallsyms|infected|malware.*linux
procedure:
- 'userland rootkit: `cat /etc/ld.so.preload` (should not exist), `env | grep LD_`, compare
  `ls` vs `echo *`, `ps` vs `ls /proc/[0-9]*`, `ss -tlnp` vs `/proc/net/tcp` -- mismatches
  = something hooking libc'
- 'kernel/LKM rootkit: `lsmod` vs `cat /proc/modules` vs `ls /sys/module`, `dmesg | grep -i
  taint`, `cat /proc/kallsyms | grep -iE ''hook|hide''`, unexpected entries in the syscall
  table (via a check module or volatility)'
- 'integrity: `pacman -Qkk` flags every package file that changed on disk (Arch''s tripwire);
  on a live box also diff against a known-good hash set'
- 'the authoritative check is offline: image the disk, run rkhunter/chkrootkit/unhide against
  the mounted image, and a memory dump through Volatility -- a rootkit lies to tools running
  under it'
