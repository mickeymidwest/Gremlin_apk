id: skill_toolresval
name: tool-result-validation
status: deprecated
destination: card
council_reviewed: false
purpose: A command exiting 0 does not prove the goal was met; verify the real effect before
  reporting success
trigger_when: after an install/build/deploy/config/write command whose success you are about
  to report
trigger_matcher: installed|successfully|exit 0|returned 0|\bdone\b|build succeeded|deployed|created|updated
procedure:
- Never report success from an exit code alone -- name the concrete artifact or state the
  task required and check it exists
- install -> confirm the binary/package is present AND its version (which <cmd>; <cmd> --version;
  pacman -Q <pkg>; npm ls -g <pkg>)
- service -> systemctl --user is-active <svc> AND the expected port is listening (ss -tlnp)
- build -> the output file exists with a sane size and a fresh mtime, not a stale artifact
  from a prior run
- file edit -> read the file back and confirm the change is actually present
- if you cannot produce evidence of the effect, report "unverified" (not "done") and say what
  check failed
