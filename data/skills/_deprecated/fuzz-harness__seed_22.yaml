name: fuzz-harness
status: deprecated
destination: card
council_reviewed: false
purpose: turn a parser/decoder into a fuzz target that finds memory bugs fast
trigger_when: fuzzing a library, file format, protocol parser, or codec
trigger_matcher: fuzz|libfuzzer|afl\+\+|honggfuzz|LLVMFuzzerTestOneInput|corpus|sanitizer|ASAN
procedure:
- 'write the smallest entry point: LLVMFuzzerTestOneInput(const uint8_t* data, size_t size)
  that calls ONE parse function'
- build with -fsanitize=address,undefined,fuzzer  (clang); for AFL++ use afl-clang-lto + a
  persistent-mode loop
- seed a corpus from real valid samples of that format; add a dictionary of magic bytes /
  keywords
- run with -max_len set near real inputs; watch for ASAN/UBSAN reports, not just SIGSEGV
- 'minimize any crash: libfuzzer -minimize_crash=1, or afl-tmin, then reproduce standalone'
