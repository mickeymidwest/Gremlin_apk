procedure:
- Write a failing test that captures the bug or the desired behavior.
- Implement the minimum code necessary to make the test pass.
- Refactor the code as needed to improve its structure and maintainability.
- Run the test suite to ensure that all tests pass.
- Repeat the process for any additional bugs or desired features.
