purpose: Ensure the agent correctly identifies and fixes the failing test before declaring
  success.
trigger_when: when a test fails
trigger_matcher: test failed
procedure:
- Identify the specific failing test and its assertion to understand the expected behavior.
- Reproduce the bug before trying to fix it.
- Read the failing test output to understand the assertion failure.
- Fix the function to handle the specific issue identified in the failing test.
- Run the failing test again to ensure it passes.
- Repeat the process for all failing tests.
