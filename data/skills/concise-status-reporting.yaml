id: skill_f13135a7
name: concise-status-reporting
status: candidate
destination: card
council_reviewed: false
purpose: Generate a precise, actionable status update that eliminates ambiguity and prevents
  redundant context loops by strictly adhering to the current codebase's structure and specific
  error contexts.
trigger_when: The agent is providing a progress or status update to the user.
trigger_matcher: status|update|progress|so far|currently|report
procedure:
- Identify the single most critical state change or decision made in the last action.
- State this state change immediately as the first sentence.
- List exactly one specific next step required to proceed.
- If a blocker exists, name the specific error or missing dependency and provide the exact
  command to resolve it.
- Explicitly omit any discussion of alternative paths or re-derived context unless the blocker
  prevents the current path.
- Verify the output contains no full-file rewrites unless a syntax error is present.
- Ensure the output does not include test execution results unless the test failure is the
  immediate blocker.
