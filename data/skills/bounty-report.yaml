procedure:
- 'title: <vuln class> in <component> leading to <impact>. One line.'
- 'severity: CVSS v3.1 vector + score, and a plain-English impact sentence (what an attacker
  gains)'
- 'repro: numbered, copy-pasteable steps from a clean state; include the exact request/input
  and the observed vs expected result'
- 'PoC: minimal, self-contained, with any account/setup noted; a short video only if the steps
  are UI-heavy'
- 'remediation: the specific fix (parameterize the query, add the bounds check, enforce the
  ACL server-side), not just ''sanitize input'''
