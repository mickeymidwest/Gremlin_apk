purpose: Identify the root cause of a bug and provide a comprehensive plan to fix it.
trigger_when: when a bug is identified
trigger_matcher: null
procedure:
- Reproduce the bug to ensure it can be seen.
- Analyze the test output to understand the assertion failure and the expected result.
- Trace the data flow to identify where the bug is introduced.
- Characterize the bug and understand its behavior.
- Develop a plan to fix the bug, including any necessary refactoring or changes to the codebase.
- Implement the fix and verify that it resolves the bug.
- Document the fix and the root cause for future reference.
