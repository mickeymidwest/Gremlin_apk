id: s1_sim_swap_phishing_awareness
name: sim-swap-phishing-awareness
status: active
destination: card
council_reviewed: true
purpose: SIM-swap and phishing bypass the device entirely by attacking the carrier and the human; no scanner
  catches them, habits do
trigger_when: SIM swap, phishing, smishing, account takeover, 2FA bypass, or a suspicious link/text/call
trigger_matcher: sim swap|sim[- ]jacking|phish|smish|vishing|2fa|\botp\b|account takeover|suspicious (link|text|email|call)
procedure:
- set a carrier port-out / SIM PIN so a SIM swap needs a code an attacker can't get; prefer an authenticator
  app or hardware key over SMS 2FA
- treat any link/attachment in an unexpected message as hostile -- verify the sender out-of-band before
  acting; check the real domain
- if an OTP arrives you didn't request, someone has your password -- change it and don't approve the prompt
