id: skill_b065f688
name: ambiguity-detection
status: candidate
destination: card
council_reviewed: false
purpose: Identify specific points in a request where missing constraints or conflicting requirements
  lead to incorrect code generation, and provide a precise, binary-choice clarification question
  to resolve them before proceeding.
trigger_when: The user's request contains vague terms, missing constraints, or conflicting
  requirements that could result in different valid code implementations or behaviors, specifically
  when the ambiguity directly impacts library inclusion, function definitions, build commands,
  or variable scoping.
trigger_matcher: ambiguous|unclear|could mean|which|either|not sure what
procedure:
- Scan the request for missing constraints regarding file paths, library headers, build tools,
  or variable definitions.
- Analyze the ambiguity to determine if it causes the agent to include the wrong header, redefine
  a function, use the wrong build command, or miss a critical variable definition.
- If the ambiguity results in a specific technical error (e.g., missing header, wrong file
  path, undefined variable), STOP immediately and do not generate any code, file edits, or
  explanations.
- Construct a single, targeted question offering exactly two specific options (e.g., 'Use
  `#include "src/ini.h"` or `#include "ini.h"`?').
- Output ONLY the clarification question and stop; do not generate any code, file edits, or
  explanations.
