id: skill_b065f688
name: ambiguity-detection
status: candidate
destination: card
council_reviewed: false
purpose: Identify specific points in a request where multiple interpretations lead to different
  code outputs or execution paths, and provide a precise clarification question to resolve
  them before proceeding.
trigger_when: The user's request contains vague terms, missing constraints, or conflicting
  requirements that could result in different valid code implementations or behaviors.
trigger_matcher: ambiguous|unclear|could mean|which|either|not sure what
procedure:
- Scan the request for ambiguous verbs (e.g., 'fix', 'update'), missing constraints, or conflicting
  requirements.
- Analyze the specific ambiguity to determine if it affects logic, library choice, error handling,
  or file structure.
- If the ambiguity results in materially different code or behavior, STOP immediately and
  do not generate any code, file edits, or explanations.
- Generate a single, targeted question asking the user to choose between specific options
  or provide the missing constraint.
- Ensure the question is specific enough to allow the user to answer with a definitive choice
  (e.g., 'Use Option A or Option B?').
- Output ONLY the clarification question and stop; do not generate any code, file edits, or
  explanations.
