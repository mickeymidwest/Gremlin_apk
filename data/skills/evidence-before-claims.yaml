id: skill_728a120f
name: evidence-before-claims
status: candidate
destination: card
council_reviewed: false
purpose: Never present an unsupported statement as fact; attach the evidence or mark it unverified
trigger_when: about to assert a fact the user will act on
trigger_matcher: assert|claim|fact|it is|definitely|the answer is
procedure:
- State the evidence (file, command output, source) alongside any factual claim
- If you have no evidence, label it as a belief/assumption, not a fact
- Prefer 'I checked X and it showed Y' over bare assertions
