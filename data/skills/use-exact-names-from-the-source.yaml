id: seed_65
name: use-exact-names-from-the-source
status: active
destination: card
council_reviewed: false
purpose: guessing an identifier wastes a compile cycle -- copy it from the file
trigger_when: calling a function, constructing a type, or importing from code you've read
trigger_matcher: undeclared|undefined|not defined|no attribute|unresolved reference|cannot
  find symbol|NameError|ImportError
procedure:
- before writing a call, open the definition and copy the name, argument order, and types
  verbatim
- '''undefined/undeclared X'' means the name is wrong or unimported -- grep the headers/modules
  for the real spelling'
- don't invent a plausible name (foo_t, getFoo) -- the codebase has one true name
