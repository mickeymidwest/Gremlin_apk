id: skill_19cd0f77
name: intent-clarification
status: candidate
destination: card
council_reviewed: false
purpose: Resolve ambiguity in user requests to prevent generating incorrect or incomplete
  code by explicitly confirming the missing constraint or assumption.
trigger_when: The user request lacks a specific constraint, input source, error-handling requirement,
  or file modification scope that is critical for the code to function correctly.
trigger_matcher: make|improve|fix|better|handle|vague|something
procedure:
- Analyze the user's request to identify if the goal is to generate new code, modify an existing
  file, or run tests.
- If modifying an existing file, determine the exact line numbers or method signatures to
  change based on the user's description of the error or desired behavior.
- If the user has not provided the specific file path, validate rules, or output format, identify
  the single most critical missing detail required to execute the task safely.
- Draft a concise, single-sentence question that asks ONLY for that specific missing detail,
  avoiding any unrelated context or assumptions.
- Stop generation immediately and output ONLY the clarifying question to the user.
- Wait for the user's response before generating any code or file edits.
- Only proceed to write code or edit files once the user has provided the necessary clarification
  and confirmed the plan.
