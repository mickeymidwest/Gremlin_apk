id: skill_19cd0f77
name: intent-clarification
status: candidate
destination: card
council_reviewed: false
purpose: Resolve ambiguity in user requests to prevent generating incorrect or incomplete
  code by explicitly confirming the missing constraint or assumption.
trigger_when: The user request lacks a specific constraint, input source, or error-handling
  requirement that is critical for the code to function correctly.
trigger_matcher: make|improve|fix|better|handle|vague|something
procedure:
- Identify the specific missing piece of information (e.g., file path, input validation rule,
  or output format) that makes the current plan risky or likely to fail.
- Draft a concise question asking the user for this specific missing detail.
- Wait for the user's response before generating any code.
- Only proceed to write code once the user has provided the necessary clarification.
