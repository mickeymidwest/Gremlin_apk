id: skill_1c2154bf
name: claim-level-verification
status: candidate
destination: card
council_reviewed: false
purpose: Verify individual factual claims, code snippets, or configuration steps within a
  response to prevent partial correctness from masking errors, specifically for code generation
  and system configuration tasks.
trigger_when: The model response contains multiple distinct factual assertions, code snippets,
  or configuration steps that can be independently validated against known facts, project
  structure, or system constraints.
trigger_matcher: answer|summary|report|findings|conclusion
procedure:
- Extract every distinct factual claim, code snippet, or configuration instruction from the
  response into a separate list.
- 'For each extracted item, perform targeted verification: check header file paths against
  the actual project structure, verify function definition locations, and confirm installation
  commands align with system package manager policies.'
- If a verification fails, identify the specific constraint violated (e.g., incorrect include
  path, wrong function signature, invalid sudo usage) and generate a specific correction adhering
  to that constraint.
- If the correction involves modifying a file, do not rewrite the entire file; instead, edit
  only the exact lines or sections affected by copying the correct content from the read file.
- If the correction would make the file invalid (SyntaxError) or if the edit is complex, switch
  to write_file with the WHOLE corrected file instead of partial edits.
- If the verification involves tests, do not manually inspect or edit the test files; instead,
  run `python -m pytest -q` to ensure the tests are fully green.
- Replace the incorrect item in the original response with the corrected version.
- If multiple items fail, report the list of all corrections required before finalizing the
  response.
