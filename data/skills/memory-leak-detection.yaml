id: skill_61d375ff
name: memory-leak-detection
status: candidate
destination: card
council_reviewed: false
purpose: Locate and patch specific code blocks causing unbounded memory growth without rewriting
  entire files or breaking syntax.
trigger_when: Memory profiling shows a continuous upward trend in RSS/heap usage under stable
  load, and the agent has read the relevant source file.
trigger_matcher: memory leak|oom|growing|unbounded|rss|heap
procedure:
- Parse the currently read source file to extract the exact line numbers and content of the
  suspected memory-leaking function(s) identified by the profiler.
- Construct a precise edit command targeting ONLY the specific lines within that function,
  preserving the original file structure and surrounding context.
- Execute the edit command to modify the file in-place.
- Immediately run `python -m pytest -q` to ensure the modification did not introduce syntax
  errors or break existing tests.
- If tests pass, re-run the memory profiler to verify the growth curve has flattened or stabilized.
