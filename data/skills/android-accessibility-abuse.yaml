id: s1_android_accessibility_abuse
name: android-accessibility-abuse
status: active
destination: card
council_reviewed: true
purpose: accessibility / device-admin / notification-listener access lets an app read the screen and act
  for you -- stalkerware's favourite grant
trigger_when: an Android app with accessibility, device admin, or notification access; stalkerware; phone
  acting weird
trigger_matcher: accessibility|device admin|notification listener|stalkerware|spyware|screen reader|a11y|BIND_ACCESSIBILITY
procedure:
- run the phone Check (phone_guard) -- it flags any NEW app holding accessibility, device-admin, or notification-listener
  access
- 'for each, ask: does this app have a real reason for it? A flashlight/game with accessibility is a red
  flag'
- revoke it in Settings and, if unexplained, uninstall the app; keep only ones you deliberately granted
