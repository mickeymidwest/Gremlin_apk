id: skill_versionaware
name: version-awareness
status: candidate
destination: card
council_reviewed: false
purpose: Establish the actually-installed tool/library version before quoting version-specific
  steps; instructions for the wrong major version waste cycles
trigger_when: before giving version-specific build/config/API steps (Android/Gradle/AGP, npm,
  pip, system CLIs)
trigger_matcher: AGP|gradle|build\.gradle|package\.json|requirements\.txt|libs\.versions\.toml|--version|deprecated|no
  longer supported|which version
procedure:
- Find the installed version FIRST -- <tool> --version, pacman -Q <pkg>, npm ls <pkg>, pip
  show <pkg>, or the project's lockfile/wrapper -- before recalling any procedure
- Android specifically -> read gradle/wrapper/gradle-wrapper.properties for the Gradle version
  and the AGP version in build.gradle(.kts) or libs.versions.toml before quoting plugin or
  DSL syntax (see android-agp9-kotlin)
- Match the procedure to that version; if steps you recall target a different major version,
  say so explicitly and adapt them
- If the version cannot be established, state the assumption out loud rather than silently
  guessing
