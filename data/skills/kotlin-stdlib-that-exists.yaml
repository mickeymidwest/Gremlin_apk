id: seed_93
name: kotlin-stdlib-that-exists
status: active
destination: card
council_reviewed: false
purpose: don't invent Kotlin functions -- use the real collection/return idioms
trigger_when: writing Kotlin that iterates, indexes, or builds a collection
trigger_matcher: \.kt\b|kotlin|allIndexed|anyIndexed|Unresolved reference|forEachIndexed|mutableListOf|MutableList|withIndex
procedure:
- 'indexed iteration: `for ((i, x) in list.withIndex())`, `list.forEachIndexed { i, x -> }`,
  `list.mapIndexed`, `list.indices` -- there is NO `allIndexed`/`anyIndexed`, use `list.withIndex().all
  { (i, x) -> ... }`'
- 'mutable list: `mutableListOf<T>()` + `.add()`, or `MutableList(n) { i -> ... }`; `listOf`
  / `List(n){}` are read-only'
- 'no `?:`-as-ternary for logic: `if (c) a else b` IS an expression; a value-returning method
  needs an explicit `return` on every path'
- before finishing, count `{` vs `}` -- a missing brace is the 7B's most common Kotlin compile
  error
supersedes: null
