purpose: Ensure the agent makes one change at a time to avoid introducing new bugs and to
  make it easier to track the impact of each change.
trigger_when: when fixing bugs
trigger_matcher: null
procedure:
- Identify the specific failing test and its assertion to understand the expected behavior.
- Read the failing test output to understand the assertion failure and the expected result.
- Reproduce the bug before trying to fix it.
- Fix one bug at a time in a failing test suite.
- Verify that the fix resolves the issue before moving on to the next bug.
