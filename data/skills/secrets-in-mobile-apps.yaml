id: seed_83
name: secrets-in-mobile-apps
status: candidate
destination: card
council_reviewed: false
purpose: APKs ship their secrets -- pull them before doing anything dynamic
trigger_when: you have an APK and want its API keys, endpoints, and hidden config
trigger_matcher: jadx|apktool|strings .*apk|hardcoded|api key|firebase|google_api_key|BuildConfig|resources.arsc
procedure:
- '`jadx` the apk; grep decompiled source + `res/values/strings.xml` + `assets/` for: api_key,
  secret, token, password, `https://` base URLs, `-----BEGIN`'
- 'Firebase: a `google-services.json` / `firebaseio.com` URL -> test `<db>.firebaseio.com/.json`
  for world-readable data; check Firestore/Storage rules'
- '`BuildConfig` fields, obfuscated string tables (run the app + Frida to dump them decrypted),
  native `.so` strings'
- check the keys' scope before reporting -- a Google Maps browser key restricted to the app
  is not a finding; an unrestricted cloud key or a private API secret is
