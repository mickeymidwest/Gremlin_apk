id: skill_23428a80
name: side-effect-awareness
status: candidate
destination: card
council_reviewed: false
purpose: Prevent silent corruption of codebases by ensuring every tool call that modifies
  file state is explicitly verified against the current state before execution.
trigger_when: The agent is about to invoke a tool (e.g., write_file, edit_file, rm, mv) that
  will alter the content or structure of a file on disk.
trigger_matcher: write|delete|install|push|deploy|modify|rm
procedure:
- Identify the target file path and the exact content or lines to be modified.
- If the modification is small (single line/function), use 'read_file' to fetch the ENTIRE
  current content of the target file.
- Extract the specific lines to be changed and apply the modification to create a new, complete
  file string.
- Validate the new file string for syntax correctness by running a quick parse check or import
  test.
- If the modification is complex, risky, or involves multiple sections, generate a textual
  diff of the proposed change and require explicit human confirmation or a full backup before
  proceeding.
- If the change involves tests, run the specific test suite and abort if output is not fully
  green.
- Execute the modification tool only after all previous checks pass and the new file content
  is syntactically valid.
