id: skill_23428a80
name: side-effect-awareness
status: candidate
destination: card
council_reviewed: false
purpose: Prevent silent corruption of codebases by ensuring every tool call that modifies
  file state is explicitly verified against the current state before execution.
trigger_when: The agent is about to invoke a tool (e.g., write_file, edit_file, rm, mv) that
  will alter the content or structure of a file on disk.
trigger_matcher: write|delete|install|push|deploy|modify|rm
procedure:
- 1. Identify the target file path and the specific lines/sections to be modified.
- 2. If the tool supports a 'dry-run' or 'preview' mode, execute it and verify the output
  matches the intended change exactly; abort if mismatched.
- 3. If no dry-run is available, use 'read_file' to fetch the ENTIRE current content of the
  target file.
- 4. Extract the exact lines to be changed from the fetched content and apply the modification
  to create a new, complete file string.
- 5. Validate the new file string for syntax correctness (e.g., run a quick parse check or
  import test) before proceeding.
- 6. If the change involves tests, run the specific test suite and abort if output is not
  fully green.
- 7. If the change is complex or risky, generate a textual diff of the proposed change and
  require explicit human confirmation or a full backup before executing the write tool.
- 8. Execute the modification tool only after all previous checks pass and the new file content
  is syntactically valid.
