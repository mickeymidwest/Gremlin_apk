id: skill_23428a80
name: side-effect-awareness
status: candidate
destination: card
council_reviewed: false
purpose: Prevent silent corruption of codebases by ensuring every tool call that modifies
  file state is explicitly verified against the current state before execution.
trigger_when: The agent is about to invoke a tool (e.g., write_file, edit_file, rm, mv) that
  will alter the content or structure of a file on disk.
trigger_matcher: write|delete|install|push|deploy|modify|rm
procedure:
- 1. Identify the target file path and the exact lines, sections, or entire file content to
  be modified.
- 2. If the modification is a small, localized fix (e.g., a single line or function), use
  'read_file' to fetch the ENTIRE current content of the target file.
- 3. Extract the exact lines to be changed from the fetched content and apply the modification
  to create a new, complete file string.
- 4. Validate the new file string for syntax correctness (e.g., run a quick parse check or
  import test) before proceeding.
- 5. If the modification is complex, risky, or involves multiple sections, generate a textual
  diff of the proposed change and require explicit human confirmation or a full backup before
  proceeding.
- 6. If the change involves tests, run the specific test suite and abort if output is not
  fully green.
- 7. Execute the modification tool only after all previous checks pass and the new file content
  is syntactically valid.
