id: skill_a8e87dc4
name: schema-evolution
status: candidate
destination: card
council_reviewed: false
purpose: Evolve data schemas while keeping old data readable
trigger_when: changing a persisted data format
trigger_matcher: schema|format|version field|evolve|compatibility|serialize
procedure:
- Identify the specific field or structure in the current file that needs modification based
  on the new schema requirements.
- Manually inspect the relevant section of the file (e.g., `graph.py`) to locate the exact
  line containing the outdated definition.
- Extract the precise line of code from the read file that represents the old schema.
- Replace ONLY that specific line in the file with the new definition, ensuring the surrounding
  code structure remains intact.
- Verify the modified file is syntactically valid by running `python -m py_compile` or attempting
  to import the module.
- Run the full test suite (`python -m pytest -q`) to ensure no existing tests fail due to
  the schema change.
- If tests pass, commit the change; if they fail, revert and re-evaluate the specific line
  replacement.
