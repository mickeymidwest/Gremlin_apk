- 'draw in onDraw(canvas): canvas.drawColor(bg) first, then shapes with reusable Paint objects
  (don''t allocate in onDraw)'
- 'input in onTouchEvent(e): handle only e.action == MotionEvent.ACTION_DOWN, hit-test against
  your stored rects, then call invalidate() to redraw'
- an options menu needs an Activity with onCreateOptionsMenu/onOptionsItemSelected and a theme
  that has an ActionBar
