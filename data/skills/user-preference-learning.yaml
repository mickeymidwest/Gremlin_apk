id: skill_5e0b1109
name: user-preference-learning
status: candidate
destination: card
council_reviewed: false
purpose: Enforce user-specified constraints, forbidden tools, and structural edits by halting
  conflicting generation, injecting rules into context, and validating output before execution.
trigger_when: User explicitly states a constraint (e.g., 'do not use X', 'limit memory'),
  forbids a tool, demands a specific file edit, or points out a syntax/logic error in the
  current draft.
trigger_matcher: prefer|don't|always|never|I like|stop doing
procedure:
- 1. Stop all current code generation and planning immediately upon detecting the constraint.
- 2. Extract the specific forbidden tool, required limit, or exact file modification from
  the user's input.
- 3. Inject the extracted constraint as a 'Hard Rule' into the active context window before
  generating the next code block.
- 4. Generate the code block while strictly adhering to the injected Hard Rule.
- 5. Perform a syntax check and a constraint-verification pass on the generated code to ensure
  no violations exist.
- 6. If the generated code violates the constraint, discard it and regenerate from step 4.
- 7. If the user's new constraint conflicts with a previous preference, explicitly acknowledge
  the override and proceed with the user's latest instruction.
- 8. Log the constraint and the resulting code state for session continuity.
