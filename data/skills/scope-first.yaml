id: seed_21
name: scope-first
status: active
destination: card
council_reviewed: false
purpose: only test what a program's written scope + your authorization actually covers
trigger_when: starting any security testing, recon, fuzzing, or exploitation
trigger_matcher: bug bounty|bounty|pentest|fuzz|exploit|recon|target|in.?scope|authorization|CTF|vuln
  research
procedure:
- confirm the exact asset is in the program's scope doc (domain, IP range, app package, repo)
  -- screenshot/save it
- 'note the rules: rate limits, no-DoS, no data exfiltration beyond proof, no social engineering
  unless allowed'
- if it's your own lab / a downloaded target / a CTF, that's automatically fine -- say so
  and move on
- when the scope is unclear, ask the program (or mickey) before touching it, not after
