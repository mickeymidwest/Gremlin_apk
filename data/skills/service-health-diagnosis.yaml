id: skill_2e87c158
name: service-health-diagnosis
status: candidate
destination: card
council_reviewed: false
purpose: Diagnose and repair failing services by executing targeted commands, analyzing specific
  error patterns, and applying precise code fixes without unnecessary file rewriting.
trigger_when: A service is reported as down, returning non-200 status codes, or exhibiting
  specific error messages in logs.
trigger_matcher: service|down|inactive|failed|not responding|unhealthy
procedure:
- Identify the exact service name, its expected port, and the specific error message or status
  code from the logs.
- Execute a targeted diagnostic command (e.g., `curl -v` for HTTP, `systemctl status` for
  systemd) and capture the raw output.
- Parse the output strictly for the specific error pattern identified (e.g., 'Connection refused',
  '503 Service Unavailable', or a specific Python traceback line).
- If the error indicates a syntax error or missing method in a Python file, read the relevant
  section of the file to locate the exact line causing the issue.
- If the error is a syntax error or the fix requires rewriting logic, generate the WHOLE corrected
  file content; otherwise, generate only the specific line or block to edit.
- 'Apply the fix using the appropriate tool: `write_file` with the full content if the file
  was rewritten, or `edit_file` with the specific line change if only a snippet was modified.'
- Run the verification command (e.g., `curl` or `pytest`) immediately after the fix.
- Confirm the service is now responding correctly or the error is resolved before concluding
  the task.
