id: skill_2e87c158
name: service-health-diagnosis
status: candidate
destination: card
council_reviewed: false
purpose: Diagnose a service failure by executing specific diagnostic commands, analyzing output
  for error patterns, and generating a targeted fix based on the evidence.
trigger_when: A service is reported as down, returning non-200 status codes, or exhibiting
  specific error messages in logs.
trigger_matcher: service|down|inactive|failed|not responding|unhealthy
procedure:
- Identify the exact service name and its expected port or endpoint.
- Execute a status check command (e.g., `curl -v`, `netstat`, or `systemctl status`) and capture
  the raw output.
- Parse the output specifically for error codes (e.g., 503, 502, ECONNREFUSED), stack traces,
  or missing resource indicators.
- Cross-reference the error pattern against the provided logs to confirm the failure mode
  (e.g., timeout vs. syntax error).
- Formulate a single, concrete hypothesis explaining the failure based strictly on the observed
  evidence.
- Generate a code fix or configuration change that directly addresses the identified root
  cause.
- Apply the fix and immediately re-run the status check to verify the service is now responding
  correctly.
