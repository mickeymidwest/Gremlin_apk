# VM tuning to go with zram swap (deploy/zram-generator.conf).
#
#   install to: /etc/sysctl.d/99-gremlin-zram.conf
#   apply now:  sudo sysctl --system
#
# swappiness high: zram swap is RAM-to-RAM and cheap, and pushing anon
# pages there means the kernel keeps more *file* cache -- which is where
# the mmap'd 4.7 GB model GGUF lives. Keeping those pages resident is
# exactly what avoids the ~90 s cold reload.
vm.swappiness = 180

# single-page writeback -- zram has no seek penalty, so don't batch.
vm.page-cluster = 0

# reclaim a little more eagerly so a spike never corners the allocator
# into an OOM (which on this box has killed background helpers before).
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
