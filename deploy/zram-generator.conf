# Compressed swap in RAM -- absorbs the memory-pressure spikes (a battle,
# a model swap, pytest beside the model) that otherwise spill to the
# 7200rpm HDD swapfile and thrash the box until the watchdog restarts
# gremlin.service. zram gets priority 100 (above the -2 HDD swapfile), so
# it's used first and the HDD file only catches genuine overflow.
#
# ~3.75 GB of zram on this 7.5 GB box; zstd compresses the model's
# spilled anon pages ~3x, so the real RAM cost is ~1-1.3 GB.
#
#   install to: /etc/systemd/zram-generator.conf
[zram0]
zram-size = min(ram / 2, 3840)
compression-algorithm = zstd
